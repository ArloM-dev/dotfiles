source = ~/.cache/iris/colors-hypr.conf
source = ~/.cache/iris/wallpapers.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

##uncomment to enable fingerprint authentication
auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = true
    animation = fadeIn, 1, 10, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wall
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.2)
    outer_color = rgba(0,0,0,0)
    check_color = $green
    fail_color = $red

    font_color = $fg
    fade_on_empty = false
    rounding = -1

    font_family = $font
    placeholder_text = Input Password
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    font_size = 90
    font_family = $font
    color = $fg

    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = $fg

    position = 0, 110
    halign = center
    valign = center
}